<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0F12">
<title>Tech ProjetAR — Tech Comunicação Visual</title>
<link rel="stylesheet" href="app.css?v=1785501334">
<link rel="manifest" href="manifest.json">
</head>
<body>
<header class="topo"><div class="topo-inner">
  <div class="marca-selo">T</div>
  <div>
    <div class="marca" style="font-size:14px">Tech Comunicação Visual</div>
    <div class="topo-sub">Tech ProjetAR</div>
  </div>
</div></header>
<main class="container" style="padding-top:24px;padding-bottom:60px">
  <h1>Projetos</h1>
  <p class="subtitulo">Antes de produzir, você visualiza. Antes de instalar, você aprova.</p>
  <div class="cartoes" id="lista" style="margin-top:18px">
    <p class="subtitulo">Carregando…</p>
  </div>
</main>
<script>
(async function () {
  var alvo = document.getElementById('lista');
  var esc = function (t) {
    return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  };
  var med = function (m) {
    m = Number(m);
    return m < 1 ? (m * 100).toLocaleString('pt-BR', {maximumFractionDigits:0}) + ' cm'
                 : m.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' m';
  };
  try {
    var r = await fetch('projetos.json?v=' + Date.now(), { cache: 'no-store' });
    var lista = (await r.json()).filter(function (p) { return p.publicado !== false; });
    if (!lista.length) { alvo.innerHTML = '<p class="subtitulo">Nenhum projeto publicado ainda.</p>'; return; }
    alvo.innerHTML = lista.map(function (p) {
      return '<a class="cartao" href="p.html?id=' + esc(p.slug) + '">'
        + '<h3>' + esc(p.titulo) + '</h3>'
        + '<div class="meta">' + esc(p.cliente || '') + (p.produto ? ' · ' + esc(p.produto) : '') + '</div>'
        + '<div class="meta">' + med(p.dimensoes.altura) + ' de altura</div>'
        + '<span class="btn btn-pequeno btn-primario" style="margin-top:6px">Abrir projeto</span>'
        + '</a>';
    }).join('');
  } catch (e) {
    alvo.innerHTML = '<p class="subtitulo">Não foi possível carregar a lista de projetos.</p>';
  }
})();
</script>
</body>
</html>
